openapi: 3.0.3
info:
  title: crm-opportunity · 商机管理
  version: 1.0.0
  description: |
    对外 REST 面；组件之间走 gRPC。
    ⚠️ 不暴露 BatchGetOpportunities——那是组件之间的 gRPC 调用，给 BFF
    一次取多条防 N+1。
    ⚠️ 赢单单独一个权限键 crm.opportunity.win，不与普通编辑合并——它会
    触发建单、锁库存、生成应收一整条链路，是本组件唯一有下游财务影响的
    动作。

servers:
  - url: /crm/opportunity

# ⚠️ /healthz 不在这份契约里：be-sdk-go 的 NewGinEngine 给每个组件统一挂的，
# 路径固定是裸根路径 /healthz。

paths:
  /opportunities:
    get:
      summary: ListOpportunities（漏斗视图的数据源）
      operationId: listOpportunities
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
          description: 游标分页，无 offset 参数——深分页在契约层面不可表达
        - name: page_size
          in: query
          schema: { type: integer }
        - name: customer_id
          in: query
          schema: { type: string }
        - name: status_filter
          in: query
          schema: { $ref: "#/components/schemas/OpportunityStatus" }
        - name: stage_id_filter
          in: query
          schema: { type: string }
        - name: view
          in: query
          schema: { type: string, enum: [mine, dept] }
          description: "省略默认 dept（本部门及下级）；mine = 我的商机（owner_id 相等）"
        - name: created_after
          in: query
          schema: { type: string, format: date-time }
        - name: created_before
          in: query
          schema: { type: string, format: date-time }
          description: created_after / created_before 都是 RFC3339；不传时只看最近 90 天，格式不对答 400
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  opportunities:
                    type: array
                    items: { $ref: "#/components/schemas/Opportunity" }
                  next_cursor: { type: string }
    post:
      summary: CreateOpportunity（建档，校验客户与产品）
      operationId: createOpportunity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOpportunityRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Opportunity" }

  /opportunities/funnel:
    get:
      summary: 商机漏斗（仪表盘：各阶段 OPEN 商机的条数、预计金额与加权金额）
      operationId: getOpportunityFunnel
      description: 权限键 crm.opportunity.view。只统计 OPEN；每个阶段占一行，按 sort_order，没有商机的阶段计 0。view 与 GET /opportunities 是同一个切换（mine = 本人负责的，省略或 dept = 本部门及下级），不是两者取并。加权金额是每条商机的加权金额四舍五入到分之后求和，与列表逐条显示的值相加一致。不加时间窗口。
      parameters:
        - name: view
          in: query
          schema: { type: string, enum: [mine, dept] }
          description: "省略默认 dept（本部门及下级）；mine = 我的商机（owner_id 相等）"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  stages:
                    type: array
                    items: { $ref: "#/components/schemas/FunnelStage" }

  /opportunities/{id}:
    get:
      summary: GetOpportunity
      operationId: getOpportunity
      description: 权限键 crm.opportunity.view。看得到的是本部门及下级的商机，或本人负责的商机；看不到的商机与不存在的一样答 404，不泄露哪些 id 存在。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Opportunity" }
        "404":
          description: 商机不存在，或不在调用者的数据范围内
    patch:
      summary: UpdateOpportunity（改金额/预计成交日/负责人）
      operationId: updateOpportunity
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOpportunityRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Opportunity" }
        "409":
          description: version 与当前值不一致（别人先改过），重新读取后再提交

  /opportunities/{id}/stage-history:
    get:
      summary: 商机的阶段流转历史（按时间先后；建档本身不算一次流转）
      operationId: listOpportunityStageHistory
      description: 权限键 crm.opportunity.view。可见性与 GET /opportunities/{id} 相同；看不到的商机与不存在的一样答 404，不泄露哪些 id 存在。不分页：一个商机的子集合。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/StageHistoryEntry" }
        "404":
          description: 商机不存在，或不在调用者的数据范围内

  /opportunities/{id}/stage:
    post:
      summary: ChangeStage（阶段推进，写历史）
      operationId: changeOpportunityStage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeStageRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Opportunity" }

  /opportunities/{id}/win:
    post:
      summary: MarkWon（⭐ 链路的扳机：转 WON + 发 crm.opportunity.won.v1）
      operationId: markOpportunityWon
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdempotentRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Opportunity" }

  /opportunities/{id}/lose:
    post:
      summary: MarkLost（转 LOST，要求填原因）
      operationId: markOpportunityLost
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkLostRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Opportunity" }

  /stages:
    get:
      summary: ListStages（阶段是数据不是代码，迁移播种，供前端阶段选择器/漏斗视图读）
      operationId: listOpportunityStages
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  stages:
                    type: array
                    items: { $ref: "#/components/schemas/OpportunityStage" }

components:
  schemas:
    OpportunityStatus:
      type: string
      enum: [OPEN, WON, LOST, CANCELLED]

    OpportunityStage:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        sort_order: { type: integer }
        default_probability: { type: integer }
        is_final: { type: boolean }

    OpportunityItem:
      type: object
      properties:
        product_id: { type: string }
        product_sku: { type: string }
        product_name: { type: string }
        uom_id: { type: string }
        qty: { type: string, description: decimal-as-string }
        quoted_unit_price:
          type: string
          description: "⚠️ 报价快照供参考，不是权威价目——erp-sales 赢单转订单时会用自己的定价引擎重算"
        subtotal:
          type: string
          description: 服务端算好直接给，不让调用方自己算

    Opportunity:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        customer_id: { type: string }
        customer_name: { type: string }
        owner_id: { type: string }
        dept_id: { type: string }
        dept_path: { type: string }
        stage_id: { type: string }
        stage_name: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OpportunityItem" }
        expected_amount: { type: string, description: 金额一律用 string 传 decimal，绝不用 double }
        probability: { type: integer, description: "0-100，阶段带默认值 + 允许手工覆盖" }
        weighted_amount: { type: string, description: "⭐ = expected_amount × probability，算出来不存" }
        expected_close_date: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/OpportunityStatus" }
        currency: { type: string }
        lost_reason: { type: string }
        won_at: { type: string, format: date-time }
        order_id:
          type: string
          description: "赢单转出的订单 id：消费 erp/sales 的 sales.order.created.v1 回填，还没有订单时为空串。订单状态归 erp/sales"
        version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StageHistoryEntry:
      type: object
      properties:
        from_stage_id: { type: string }
        to_stage_id: { type: string }
        probability:
          type: integer
          nullable: true
          description: 这次流转设定的概率（阶段默认值或手工覆盖值）；为 null 的行写下时还没有记录概率
        changed_by: { type: string, description: 操作人的 sub }
        changed_at: { type: string, format: date-time }

    FunnelStage:
      type: object
      properties:
        stage_id: { type: string }
        stage_name: { type: string }
        count: { type: integer, description: 这个阶段上 OPEN 商机的条数 }
        expected_amount: { type: string, description: 预计金额合计，十进制字符串，两位小数 }
        weighted_amount: { type: string, description: 加权金额合计（每条先四舍五入到分再求和），十进制字符串，两位小数 }

    IdempotentRequest:
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key:
          type: string
          description: 跨重试幂等键，被调用方用唯一约束去重

    CreateOpportunityItemInput:
      type: object
      required: [product_id, qty, quoted_unit_price]
      properties:
        product_id: { type: string }
        qty: { type: string }
        quoted_unit_price: { type: string }

    CreateOpportunityRequest:
      type: object
      required: [idempotency_key, name, customer_id, items, expected_amount]
      properties:
        idempotency_key: { type: string }
        name: { type: string }
        customer_id: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/CreateOpportunityItemInput" }
        expected_amount: { type: string }
        probability:
          type: integer
          description: 留空则用初始阶段的 default_probability
        expected_close_date: { type: string, format: date-time }
        currency: { type: string, description: 留空则服务端按本位币默认值处理 }

    UpdateOpportunityRequest:
      type: object
      required: [idempotency_key, version]
      properties:
        idempotency_key: { type: string }
        version: { type: integer, format: int64, description: 乐观锁：与库里不一致则拒绝 }
        name: { type: string, description: 每次都要带；空的答 400 }
        expected_amount: { type: string, description: 每次都要带；十进制字符串，最多两位小数 }
        expected_close_date: { type: string, format: date-time, description: 不带（或空串）则保留原值；设了之后只能改、不能清空 }
        owner_id: { type: string, description: 改负责人；不带（或空串）则保留原值 }

    ChangeStageRequest:
      type: object
      required: [idempotency_key, to_stage_id]
      properties:
        idempotency_key: { type: string }
        to_stage_id: { type: string }
        probability_override:
          type: integer
          description: 留空则用目标阶段的 default_probability

    MarkLostRequest:
      type: object
      required: [idempotency_key, reason]
      properties:
        idempotency_key: { type: string }
        reason: { type: string, description: 必填：失单必须记原因 }
