apiVersion: brickkit/v1
kind: Component

metadata:
  id: crm/opportunity                 # ⚠️ Fork 件必须与标准件完全一致（§3.4.1）
  name: 商机管理
  version: 1.0.7                     # 精确版本，不接受 ^ / ~ / latest
    # v1.0.7：依赖版本号同步跟进 mdm/product@1.0.6（补 README 的"怎么
    # 起来"/"怎么用"/"配置项"三节，纯文档修复），无破坏性变更。
    # v1.0.6：make seed 加量到 11 条商机——1-5 号原样保留（dev.superuser，
    # 只增不改），新增 6-10 号改用 dev.sales.east（华东分部）的真实 JWT
    # 建，同样覆盖 OPEN 三阶段/WON/LOST，外加时间跨度回填（最近 2-25 天
    # 逐步推进）；新增 11 号是刻意信用超限的 WON 商机（低信用客户+足够
    # 大的 qty），赢单后 erp-sales 真实拒绝确认，真实建一条
    # infra-workflow 异常待办——用真实业务失败路径给 infra-workflow 造
    # 真实数据，不用直接 grpcurl 伪造 CreateTask（那会绕开该组件明确的
    # 设计安全边界，见该组件 proto 注释）。真机验证：dev.sales.east 的
    # token 查列表只看到 6-11 号，org 维数据权限第一次有真实商机样本能
    # 登录体验；两个成功的 WON 商机（4/9 号）都拿到干净 CONFIRMED 订单，
    # 归属分别正确带着"无部门"/"华东"；11 号的订单真实卡在 DRAFT，
    # infra-workflow 真实多一条归属正确（华东）的异常待办。把
    # infra/seed-data/clean.sh 里"清理 erp-sales 联带订单"那段逻辑挪进
    # 本组件自己的 scripts/seed-clean.sh（反查真实订单 id 精确删除，
    # 比原来按客户 id 模糊扫更精确）——这是删掉 infra/seed-data/ 的
    # 前提条件，已满足。依赖版本号同步跟进 mdm/customer@1.0.5、
    # mdm/product@1.0.5（种子数据丰富度批量整改）。无破坏性变更。
    # v1.0.5：新增 scripts/seed.sh + make seed/seed-clean——种子商机归
    # 本组件自己持有（总纲 SOP-W-7），Makefile 链式调用强依赖
    # mdm-customer/mdm-product 与身份类例外 infra-iam-casdoor/
    # infra-authz 各自的 seed，单独 make -C components/crm/opportunity
    # seed 就能拿到完整数据。真机验证过标准配合"给库存的编排层顺序"
    # 才能让 WON 商机自动转的订单真正 CONFIRMED（单独跑本组件的 seed，
    # 没有编排层给库存的话，会走 erp-sales 真实的 TCC 补偿建异常待办，
    # 这是设计上正确的行为，不是 bug）。纯本地开发工具，无行为/契约
    # 变更。
    # v1.0.4：docs/手册.md 的 TEST_PG_DSN 示例改指向 brickkit_test_db，
    # 纯文档，无行为/契约变更。
    # v1.0.3：补 ListOpportunities 的真实数据权限边界测试
    # （TestListOpportunities_org维前缀过滤/_owner维过滤）——此前 repo
    # 包只有 TestInScope 一个纯函数单元测试，验证的是判定谓词本身，
    # ListOpportunities 真实的 SQL 过滤路径完全没有真实数据覆盖过。
    # 纯补测试，无行为/契约变更。
    # v1.0.2：弱依赖版本号同步跟进 mdm/customer@1.0.4、mdm/product@1.0.4
    # （新增 make seed/seed-clean，无破坏性变更）。
    # v1.0.1：补数据权限边界测试（TestGetOpportunity_范围外ErrForbidden/
    # _owner精确命中即使部门不同）——be-acceptance@v0.3.5 新增
    # data-scope-test-scan 门禁发现本组件此前零覆盖（总纲 SOP-W-8）。
    # 纯补测试，无行为/契约变更。
  description: 商机全生命周期、漏斗与赢单预测原始数据、赢单事件——阶段三第一个业务组件，CRM 与 ERP 零同步边仅事件握手
  license: Apache-2.0
  vendor: brickKit

tags: [crm, opportunity, sales-funnel]

artifacts:
  - type: api-contract
    format: protobuf
    files:
      - contracts/crm/opportunity/v1/opportunity.proto
      - contracts/events/opportunity.events.json
  - type: api-contract
    format: openapi
    files: [contracts/opportunity.openapi.yaml]
  - type: metadata                   # ← assembly.yaml 靠这一条随组件分发（§3.5）
    files: [assembly.yaml]

# 两条强依赖，都是只读枢纽的 BatchGet（设计计划 §5）：建商机/商机行时
# 校验客户与产品存在、取展示快照——建档那一刻就要挡住脏数据。
#
# ⚠️ 明确不依赖 erp-sales/erp-inventory/erp-finance/infra-workflow——
# §1.4 铁律：CRM 与 ERP 零同步边，仅事件握手（设计计划 §6）。附录 E
# 那条"商机赢单→建订单"链路看起来像该建一条同步边，实际上正是这条
# 铁律第一次被真正考验的地方，答案是事件握手不是同步调用。
dependencies:
  components:
    - mdm/customer@1.0.5
    - mdm/product@1.0.6
  resources:
    # ⚠️ engine 逐字参与匹配（设计书 §2.7.3.1）：这里写的词必须与
    #    brickkit.yaml 的 resources[].engine 完全相同，平台不认别名。
    - { kind: database, engine: postgresql }   # 产品名：不在替换范围
    - { kind: mq,       engine: nats }         # 产品名：换 Kafka 是一次迁移，要让平台阻断

configSchema:
  type: object
  properties:
    pgSchema:                        # ⚠️ 不能叫 databaseSchema，DATABASE_ 是保留前缀
      type: string
      default: crm_opportunity
    iamJwksUrl:                      # JWT 本地验签的公钥来源。不对 IAM 建依赖边（决策 87）
      type: string
    authzBundleUrl:                  # 功能权限判定的 bundle 轮询地址，指向 infra-authz。不建依赖边
      type: string
    otelBaseUrl:                     # ⚠️ 不能叫 otelEndpoint，*_ENDPOINT 是保留后缀
      type: string
      default: ""                    # 空 → Blackhole Exporter，零成本（§7.5）

deployment:
  type: container
  image: brickenterprise/crm-opportunity:1.0.7
  port: 8102                         # 端口册 registry/ports.tsv
  extraPorts:
    - { name: grpc, port: 9102 }     # → CRM_OPPORTUNITY_GRPC_ENDPOINT（值仍以 http:// 开头）
  labels:                            # 平台只搬运，不解释键值。值必须是字符串
    prometheus.io/scrape: "true"
    prometheus.io/port: "8102"
    prometheus.io/path: "/metrics"
  resources:
    requests: { cpu: "100m", memory: "128Mi" }  # 无 TCC 编排、无补偿链，比 erp-sales 轻

migration:
  command: ["./migrate", "up"]

healthCheck:
  type: http
  path: /healthz                     # ⚠️ 只查本进程存活，严禁查库或查依赖组件（§12.3.6）
  # startPeriodSeconds 不写：默认就是 60，Go 组件够用（§12.3.5）
