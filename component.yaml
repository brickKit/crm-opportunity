apiVersion: brickkit/v1
kind: Component

metadata:
  id: crm/opportunity
  name: Opportunities
  version: 2.0.0
  description: Opportunity lifecycle, sales funnel and win-forecast data; publishes won, lost and stage-changed events.
  repository: https://github.com/brickKit/crm-opportunity
  license: Apache-2.0
  vendor: brickKit

tags: [crm, opportunity, sales-funnel]

artifacts:
  - type: api-contract
    format: protobuf
    files: [contracts/crm/opportunity/v1/opportunity.proto, contracts/events/opportunity.events.json]
  - type: api-contract
    format: openapi
    files: [contracts/opportunity.openapi.yaml]
  - type: metadata
    files: [assembly.yaml]

dependencies:
  components: [mdm/customer@2.0.1, mdm/product@2.0.0]

configSchema:
  type: object
  properties:
    PG_HOST: {type: string}
    PG_PORT: {type: string, default: "5432"}
    PG_DATABASE: {type: string}
    PG_USER: {type: string}
    PG_PASSWORD: {type: string, secret: true}
    PG_SCHEMA: {type: string, default: crm_opportunity}
    NATS_URL: {type: string}
    OTEL_BASE_URL: {type: string, default: ""}
    AUTHZ_BUNDLE_URL: {type: string}
    IAM_JWKS_URL: {type: string}
  required: [PG_HOST, PG_DATABASE, PG_USER, PG_PASSWORD, NATS_URL, AUTHZ_BUNDLE_URL, IAM_JWKS_URL]

deployment:
  type: container
  build: {context: ., dockerfile: Dockerfile}
  port: 8102
  extraPorts:
    - {name: grpc, port: 9102}
  labels:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
  resources:
    requests: {cpu: 100m, memory: 128Mi}

migration:
  command: [./migrate, up]

healthCheck:
  type: http
  path: /healthz

local:
  language: go
  runCommand: [go, run, ./backend/cmd/server]
